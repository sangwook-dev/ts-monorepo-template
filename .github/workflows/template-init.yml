name: Template init

# 템플릿 저장소 전용 — `pnpm init:project`가 이 파일을 지운다.
# 모듈 조합마다 init을 돌린 뒤 전체 검사를 다시 돌려, 어떤 조합으로 시작해도 처음부터 초록인지 확인한다.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: template-init-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  init:
    name: init --without=${{ matrix.without || '(없음)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        without: ['', 'db', 'api', 'claude', 'api,claude']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup workspace
        uses: ./.github/actions/setup

      # 이 PR의 공유 lint 규칙을 시험한다 — 판을 올린 PR은 머지 뒤에야 npm에 배포되므로, 배포될 것과 같은 tarball을 만들어
      # init이 npm의 판 대신 그것을 쓰게 한다(ADR 0021). 배포 판(빌드한 JS)이 소비 저장소에서 불러와지는지도 여기서 본다
      - name: Pack lint-guardrails
        working-directory: packages/guardrails
        run: pnpm pack --pack-destination "$RUNNER_TEMP/guardrails"

      - name: Init
        env:
          WITHOUT: ${{ matrix.without }}
        run: |
          GUARDRAILS_TARBALL="$(ls "$RUNNER_TEMP"/guardrails/lint-guardrails-*.tgz)" \
            pnpm init:project demo-app "--without=${WITHOUT}"

      - name: No placeholders left
        run: |
          if git grep -n -E '@app/|ts-monorepo-template' -- ':!.claude/skills'; then
            echo "::error::init 뒤에 자리표시자가 남았다"
            exit 1
          fi

      # init 뒤의 작업 트리 그대로 — 새 저장소의 첫 커밋이 통과해야 하는 것과 같은 검사
      - name: Quality checks
        run: |
          pnpm turbo run lint check-types test
          pnpm check-types:tooling
          pnpm lint:tooling
          pnpm test:scripts
          pnpm format:check
